/* ---------------------- Constructor de prácticas personalizadas ---------------------- */
function PracticeBuilderPage({ uid, onSaved }) {
  const [phase, setPhase] = useState("routines");
  const [routines, setRoutines] = useState(null);
  const [activities, setActivities] = useState([]);
  const [duration, setDuration] = useState(5);
  const [customDuration, setCustomDuration] = useState("");
  const [difficulty, setDifficulty] = useState("principiante");
  const [theme, setTheme] = useState("Vida cotidiana");
  const [steps, setSteps] = useState([]);
  const [routineName, setRoutineName] = useState("");

  const loadRoutines = async () => {
    const snap = await db.collection("users").doc(uid).collection("routines").orderBy("createdAt", "desc").get();
    setRoutines(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
  };
  useEffect(() => { loadRoutines(); }, []);

  const toggleActivity = (key) => setActivities((a) => (a.includes(key) ? a.filter((x) => x !== key) : [...a, key]));
  const effectiveDuration = duration === "custom" ? (parseInt(customDuration, 10) || 5) : duration;

  const generate = () => {
    setSteps(buildCustomSteps({ activities, duration: effectiveDuration, difficulty, theme }));
    setPhase("preview");
  };

  const saveRoutine = async () => {
    const config = {
      name: routineName || `Mi práctica de ${theme.toLowerCase()}`,
      activities, duration: effectiveDuration, difficulty, theme,
    };
    await db.collection("users").doc(uid).collection("routines").add({
      ...config, createdAt: firebase.firestore.FieldValue.serverTimestamp(),
    });
    await loadRoutines();
  };

  const startFromRoutine = (r) => {
    setActivities(r.activities); setDuration(r.duration); setDifficulty(r.difficulty); setTheme(r.theme);
    setSteps(buildCustomSteps(r));
    setPhase("preview");
  };

  const deleteRoutine = async (id) => {
    await db.collection("users").doc(uid).collection("routines").doc(id).delete();
    await loadRoutines();
  };

  if (phase === "running") {
    return (
      <CustomPracticeRunner
        uid={uid}
        steps={steps}
        config={{ activities, duration: effectiveDuration, difficulty, theme }}
        onExit={() => setPhase("preview")}
        onFinish={() => { setPhase("done"); onSaved(); }}
      />
    );
  }

  if (phase === "done") {
    return (
      <div style={{ maxWidth: 480, margin: "0 auto", padding: "60px 24px", textAlign: "center" }}>
        <div style={{ fontSize: 44, marginBottom: 10 }}>🎉</div>
        <h1 style={{ fontFamily: display, fontSize: 26, color: colors.ink, marginBottom: 8 }}>¡Práctica completada!</h1>
        <p style={{ fontFamily: font, color: colors.inkSoft, marginBottom: 26 }}>Quedó guardada en tu progreso.</p>
        <PrimaryButton onClick={() => setPhase("routines")}>Volver</PrimaryButton>
      </div>
    );
  }

  if (phase === "preview") {
    return (
      <div style={{ maxWidth: 560, margin: "0 auto", padding: "36px 24px 100px" }}>
        <button onClick={() => setPhase("build")} style={backLinkStyle}>← Editar</button>
        <Pill>Personalizada</Pill>
        <h1 style={{ fontFamily: display, fontSize: 26, color: colors.ink, margin: "10px 0 6px" }}>Tu práctica está lista</h1>
        <p style={{ fontFamily: font, fontSize: 14, color: colors.inkSoft, marginBottom: 22 }}>
          Una sesión de {effectiveDuration} min sobre {theme.toLowerCase()} · {BUILDER_DIFFICULTIES.find((d) => d.id === difficulty).label}
        </p>
        <Card style={{ marginBottom: 20 }}>
          {steps.map((s, i) => (
            <div key={i} style={{
              display: "flex", justifyContent: "space-between", padding: "10px 0",
              borderBottom: i < steps.length - 1 ? `1px solid ${colors.border}` : "none",
            }}>
              <div>
                <div style={{ fontFamily: font, fontWeight: 700, fontSize: 14, color: colors.ink }}>{ACTIVITY_LABELS[s.key]}</div>
                <div style={{ fontFamily: font, fontSize: 12.5, color: colors.inkSoft }}>{s.label}</div>
              </div>
              <div style={{ fontFamily: mono, fontSize: 12.5, color: colors.teal, alignSelf: "center" }}>{Math.round(s.minutes)} min</div>
            </div>
          ))}
        </Card>
        <p style={{ fontFamily: font, fontSize: 11.5, color: colors.inkSoft, marginBottom: 16 }}>
          Esta vista es un ejemplo de tu práctica — todavía no has iniciado la sesión.
        </p>
        <div style={{ display: "flex", gap: 10, flexWrap: "wrap" }}>
          <PrimaryButton onClick={() => setPhase("running")}>Comenzar práctica</PrimaryButton>
          <GhostButton onClick={saveRoutine}>Guardar esta rutina</GhostButton>
        </div>
      </div>
    );
  }

  if (phase === "build") {
    return (
      <div style={{ maxWidth: 620, margin: "0 auto", padding: "36px 24px 100px" }}>
        <button onClick={() => setPhase("routines")} style={backLinkStyle}>← Volver</button>
        <h1 style={{ fontFamily: display, fontSize: 26, color: colors.ink, marginBottom: 4 }}>Crear mi práctica</h1>
        <p style={{ fontFamily: font, fontSize: 13.5, color: colors.inkSoft, marginBottom: 24 }}>Diseña una sesión adaptada a tus preferencias.</p>

        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontFamily: font, fontWeight: 700, color: colors.ink, marginBottom: 10 }}>A. Elige las actividades</div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 10 }}>
            {BUILDER_ACTIVITIES.map((a) => (
              <button key={a.key} onClick={() => toggleActivity(a.key)} style={{
                display: "flex", alignItems: "center", gap: 10, textAlign: "left", padding: 12, borderRadius: 14,
                border: `1.5px solid ${activities.includes(a.key) ? colors.teal : colors.border}`,
                background: activities.includes(a.key) ? colors.mintSoft : "#fff", cursor: "pointer",
              }}>
                <img src={a.image} alt={a.label} style={{ width: 28, height: 28, objectFit: "contain", flexShrink: 0 }} />
                <div>
                  <div style={{ fontFamily: font, fontWeight: 700, fontSize: 13.5, color: colors.ink }}>{a.label}</div>
                  <div style={{ fontFamily: font, fontSize: 11.5, color: colors.inkSoft }}>{a.desc}</div>
                </div>
              </button>
            ))}
          </div>
          <div style={{ fontFamily: mono, fontSize: 11.5, color: colors.inkSoft, marginTop: 10 }}>
            {activities.length} actividad{activities.length === 1 ? "" : "es"} seleccionada{activities.length === 1 ? "" : "s"}
          </div>
        </Card>

        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontFamily: font, fontWeight: 700, color: colors.ink, marginBottom: 10 }}>B. Elige duración</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {BUILDER_DURATIONS.map((d) => (
              <button key={d} onClick={() => setDuration(d)} style={{
                padding: "9px 16px", borderRadius: 999, cursor: "pointer",
                border: `1.5px solid ${duration === d ? colors.teal : colors.border}`,
                background: duration === d ? colors.teal : "#fff", color: duration === d ? "#fff" : colors.ink,
                fontFamily: font, fontWeight: 600, fontSize: 13.5,
              }}>{d} min</button>
            ))}
            <button onClick={() => setDuration("custom")} style={{
              padding: "9px 16px", borderRadius: 999, cursor: "pointer",
              border: `1.5px solid ${duration === "custom" ? colors.teal : colors.border}`,
              background: duration === "custom" ? colors.teal : "#fff", color: duration === "custom" ? "#fff" : colors.ink,
              fontFamily: font, fontWeight: 600, fontSize: 13.5,
            }}>Personalizada</button>
          </div>
          {duration === "custom" && (
            <input type="number" min="1" value={customDuration} onChange={(e) => setCustomDuration(e.target.value)}
              placeholder="Minutos" style={{ ...inputStyle, marginTop: 10, maxWidth: 140 }} />
          )}
        </Card>

        <Card style={{ marginBottom: 16 }}>
          <div style={{ fontFamily: font, fontWeight: 700, color: colors.ink, marginBottom: 10 }}>C. Elige dificultad</div>
          <p style={{ fontFamily: font, fontSize: 11.5, color: colors.inkSoft, marginBottom: 10 }}>
            Se refiere a la complejidad del ejercicio, no a tu capacidad.
          </p>
          <div style={{ display: "grid", gap: 8 }}>
            {BUILDER_DIFFICULTIES.map((d) => (
              <button key={d.id} onClick={() => setDifficulty(d.id)} style={{
                textAlign: "left", padding: 12, borderRadius: 14, cursor: "pointer",
                border: `1.5px solid ${difficulty === d.id ? colors.teal : colors.border}`,
                background: difficulty === d.id ? colors.mintSoft : "#fff",
              }}>
                <div style={{ fontFamily: font, fontWeight: 700, fontSize: 13.5, color: colors.ink }}>{d.label}</div>
                <div style={{ fontFamily: font, fontSize: 12, color: colors.inkSoft }}>{d.desc}</div>
              </button>
            ))}
          </div>
        </Card>

        <Card style={{ marginBottom: 20 }}>
          <div style={{ fontFamily: font, fontWeight: 700, color: colors.ink, marginBottom: 10 }}>D. Elige un tema</div>
          <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
            {BUILDER_THEMES.map((t) => (
              <button key={t} onClick={() => setTheme(t)} style={{
                padding: "9px 16px", borderRadius: 999, cursor: "pointer",
                border: `1.5px solid ${theme === t ? colors.teal : colors.border}`,
                background: theme === t ? colors.mintSoft : "#fff", color: theme === t ? colors.teal : colors.ink,
                fontFamily: font, fontWeight: 600, fontSize: 13.5,
              }}>{t}</button>
            ))}
          </div>
        </Card>

        <PrimaryButton disabled={activities.length === 0} onClick={generate} style={{ width: "100%", justifyContent: "center" }}>
          Ver diseño de la práctica
        </PrimaryButton>
      </div>
    );
  }

  return (
    <div style={{ maxWidth: 640, margin: "0 auto", padding: "36px 24px 100px" }}>
      <h1 style={{ fontFamily: display, fontSize: 28, color: colors.ink, marginBottom: 6 }}>Crear mi práctica</h1>
      <p style={{ fontFamily: font, fontSize: 13.5, color: colors.inkSoft, marginBottom: 24 }}>
        Diseña una sesión adaptada a tus preferencias, o repite una rutina guardada.
      </p>
      <PrimaryButton
        onClick={() => { setActivities([]); setDuration(5); setDifficulty("principiante"); setTheme("Vida cotidiana"); setRoutineName(""); setPhase("build"); }}
        style={{ marginBottom: 24 }}
      >
        + Nueva práctica
      </PrimaryButton>
      {routines === null ? (
        <p style={{ fontFamily: font, color: colors.inkSoft }}>Cargando tus rutinas…</p>
      ) : routines.length === 0 ? (
        <Note>Todavía no guardaste ninguna rutina personalizada.</Note>
      ) : (
        <div style={{ display: "grid", gap: 10 }}>
          {routines.map((r) => (
            <Card key={r.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", gap: 12, flexWrap: "wrap" }}>
              <div>
                <div style={{ fontFamily: font, fontWeight: 700, fontSize: 14.5, color: colors.ink }}>{r.name}</div>
                <div style={{ fontFamily: mono, fontSize: 11.5, color: colors.inkSoft, marginTop: 4 }}>
                  {r.duration} min · {BUILDER_DIFFICULTIES.find((d) => d.id === r.difficulty) && BUILDER_DIFFICULTIES.find((d) => d.id === r.difficulty).label} · {r.activities.map((a) => ACTIVITY_LABELS[a]).join(", ")}
                </div>
              </div>
              <div style={{ display: "flex", gap: 8 }}>
                <GhostButton onClick={() => startFromRoutine(r)}>Usar</GhostButton>
                <GhostButton onClick={() => deleteRoutine(r.id)} style={{ color: colors.danger, borderColor: colors.danger }}>Eliminar</GhostButton>
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

function LoggedInApp({ authUser }) {
  const [page, setPage] = useState("dashboard");
  const [profile, setProfile] = useState(null);
  const [stats, setStats] = useState({ sessions: [], totalSessions: 0, totalMinutes: 0, streak: 0, unlockedIds: new Set() });
  const [loading, setLoading] = useState(true);

  const refresh = async () => {
    const doc = await db.collection("users").doc(authUser.uid).get();
    setProfile(doc.data() || { email: authUser.email });
    const s = await loadStats(authUser.uid);
    setStats(s);
    setLoading(false);
  };

  useEffect(() => { refresh(); }, []);

  if (loading) return <div style={{ padding: 60, textAlign: "center", fontFamily: font, color: colors.inkSoft }}>Cargando tu progreso…</div>;

  if (!profile.focusAreas) {
    return <OnboardingQuestionnaire uid={authUser.uid} onDone={refresh} />;
  }

  const user = { name: profile.name, email: profile.email };

  return (
    <div style={{ background: "transparent", minHeight: "100vh" }}>
      <TopBar page={page} navigate={setPage} onLogout={() => auth.signOut()} />
      {page === "dashboard" && <CourseHome uid={authUser.uid} navigate={setPage} xp={profile.xp || 0} />}
      {page === "mis-cursos" && <MyCoursesPage uid={authUser.uid} navigate={setPage} />}
      {page === "builder" && <PracticeBuilderPage uid={authUser.uid} onSaved={refresh} />}
      {page === "curso-breathing" && <CourseDetailPage areaKey="breathing" uid={authUser.uid} navigate={setPage} goBack={() => setPage("mis-cursos")} />}
      {page === "curso-reading" && <CourseDetailPage areaKey="reading" uid={authUser.uid} navigate={setPage} goBack={() => setPage("mis-cursos")} />}
      {page === "curso-conversation" && <CourseDetailPage areaKey="conversation" uid={authUser.uid} navigate={setPage} goBack={() => setPage("mis-cursos")} />}
      {page === "curso-articulation" && <CourseDetailPage areaKey="articulation" uid={authUser.uid} navigate={setPage} goBack={() => setPage("mis-cursos")} />}
      {page === "breathing" && <BreathingPage uid={authUser.uid} onSaved={refresh} goBack={() => setPage("curso-breathing")} />}
      {page === "reading" && <ReadingPage uid={authUser.uid} onSaved={refresh} goBack={() => setPage("curso-reading")} allowAnalysis={!!profile.allowPronunciationAnalysis} />}
      {page === "conversation" && <ConversationPage uid={authUser.uid} onSaved={refresh} goBack={() => setPage("curso-conversation")} />}
      {page === "articulation" && <ArticulationPage uid={authUser.uid} onSaved={refresh} goBack={() => setPage("curso-articulation")} />}
      {page === "achievements" && <AchievementsPage stats={stats} />}
      {page === "leaderboard" && <LeaderboardPage uid={authUser.uid} />}
      {page === "progress" && <MyProgressPage stats={stats} xp={profile.xp || 0} />}
      {page === "levels" && <LevelAreasHome uid={authUser.uid} navigate={setPage} />}
      {page === "levels-breathing" && <LevelsPage uid={authUser.uid} areaKey="breathing" goBack={() => setPage("curso-breathing")} onSaved={refresh} />}
      {page === "levels-reading" && <LevelsPage uid={authUser.uid} areaKey="reading" goBack={() => setPage("curso-reading")} onSaved={refresh} />}
      {page === "levels-conversation" && <LevelsPage uid={authUser.uid} areaKey="conversation" goBack={() => setPage("curso-conversation")} onSaved={refresh} />}
      {page === "levels-articulation" && <LevelsPage uid={authUser.uid} areaKey="articulation" goBack={() => setPage("curso-articulation")} onSaved={refresh} />}
      {page === "profile" && <ProfilePage uid={authUser.uid} profile={profile} onSaved={refresh} />}
    </div>
  );
}

function Root() {
  const [authUser, setAuthUser] = useState(undefined);

  useEffect(() => {
    if (!firebaseOk) { setAuthUser(null); return; }
    return auth.onAuthStateChanged(setAuthUser);
  }, []);

  let content;
  if (!firebaseOk) content = <SetupNeeded />;
  else if (authUser === undefined) content = <div style={{ padding: 60, textAlign: "center", fontFamily: font }}>Cargando…</div>;
  else if (authUser === null) content = <AuthScreen />;
  else content = <LoggedInApp authUser={authUser} />;

  return (
    <>
      <ParticleBackground />
      <div style={{ position: "relative", zIndex: 1 }}>{content}</div>
    </>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<Root />);
</script>
